services:
  db:
    image: postgres:17-alpine
    container_name: recipe-organiser-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipe
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
    ports:
      # Local-only access for Drizzle and database clients.
      - '127.0.0.1:5432:5432'
    volumes:
      - recipe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U recipe -d recipe]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: quay.io/minio/minio:latest
    container_name: recipe-organiser-s3
    restart: unless-stopped
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      # S3 API and MinIO Console. Keep both local-only in development.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 10

  s3-init:
    image: quay.io/minio/mc:latest
    container_name: recipe-organiser-s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
      S3_BUCKET: ${S3_BUCKET:-recipe-images}
      S3_CORS_ORIGIN: ${S3_CORS_ORIGIN:-http://localhost:3000}
    entrypoint: |
      /bin/sh -c '
      mc alias set local http://s3:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
      mc mb --ignore-existing "local/$$S3_BUCKET" &&
      cat > /tmp/cors.xml <<EOF
      <CORSConfiguration>
        <CORSRule>
          <AllowedOrigin>$$S3_CORS_ORIGIN</AllowedOrigin>
          <AllowedMethod>GET</AllowedMethod>
          <AllowedMethod>HEAD</AllowedMethod>
          <AllowedMethod>PUT</AllowedMethod>
          <AllowedHeader>content-type</AllowedHeader>
          <ExposeHeader>ETag</ExposeHeader>
          <MaxAgeSeconds>3000</MaxAgeSeconds>
        </CORSRule>
      </CORSConfiguration>
      EOF
      mc cors set "local/$$S3_BUCKET" /tmp/cors.xml
      '
    restart: no

volumes:
  recipe_postgres_data:
  minio_data:
